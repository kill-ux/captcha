<div class="flex flex-col gap-4">
  <div class="border-[3px] border-[#2a2a2a] bg-[#0f0f0f] p-1">
    <img [src]="imageUrl" alt="Math problem in an image: add the two numbers and type the result" class="w-full block" />
  </div>

  <label for="math-answer" class="sr-only">Result of the math problem</label>
  <input
    id="math-answer"
    type="text"
    inputmode="numeric"
    autocomplete="off"
    [formControl]="answerControl"
    [readOnly]="readonly()"
    placeholder="ANSWER"
    [attr.aria-invalid]="errorMessage ? 'true' : null"
    [attr.aria-describedby]="errorMessage ? 'math-error' : null"
    (keyup.enter)="submit()"
    class="w-full px-4 py-3 text-sm font-bold tracking-wide uppercase text-center
           bg-[#1a1a1a] border-[3px] border-[#2a2a2a]
           text-[#e5e5e5]
           focus:outline-none focus:bg-[#111111] focus:border-[#4ade80]
           read-only:opacity-70
           placeholder:text-[#e5e5e5]/60" />

  @if (errorMessage; as message) {
    <p id="math-error" role="alert" class="text-[11px] text-[#ff3b30] font-bold uppercase tracking-wide">[ERR] {{ message }}</p>
  }

  @if (!readonly()) {
    <button
      type="button"
      (click)="submit()"
      [disabled]="disabled()"
      class="press-btn w-full py-3 text-sm font-bold tracking-[0.15em] uppercase
             bg-[#0f0f0f] text-[#e5e5e5] border-[3px] border-[#2a2a2a]
             shadow-[5px_5px_0_#4ade80]
             hover:bg-[#1a1a1a]
             disabled:opacity-40 disabled:cursor-not-allowed">
      Submit
    </button>
  }
</div>
