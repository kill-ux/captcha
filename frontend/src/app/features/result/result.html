<section class="min-h-screen flex items-center justify-center bg-[#111111] px-4 font-mono">

  <div class="relative w-full max-w-md">

    <div class="absolute -top-3 -left-3 w-6 h-6 bg-[#1f1f1f]"></div>
    <div class="absolute -top-3 -right-3 w-6 h-6 bg-[#1f1f1f]"></div>

    <div class="bg-[#1a1a1a] border-[3px] border-[#2a2a2a] shadow-[8px_8px_0_#000000]">

      <div class="flex items-center justify-between border-b-[3px] border-[#2a2a2a] px-4 py-2 bg-[#0f0f0f] text-[#e5e5e5]">
        <span class="text-[11px] tracking-[0.2em] uppercase">SYS // ACCESS-CTRL</span>
        <span class="text-[11px] tracking-[0.2em]">03</span>
      </div>

      <div class="px-8 py-10 flex flex-col items-center gap-6 text-center">

        <div class="h-14 w-14 border-[3px] border-[#2a2a2a] flex items-center justify-center">
          <svg class="h-7 w-7 text-[#4ade80]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
            <path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>

        <div class="flex flex-col gap-1">
          <h1 class="text-2xl font-black tracking-tight text-[#e5e5e5] uppercase">
            Access Granted
          </h1>
          <p class="text-[12px] text-[#e5e5e5]/60 tracking-wide">
            [ all stages verified ]
          </p>
        </div>

        <div class="w-full border-t-[3px] border-dashed border-[#e5e5e5]/20"></div>

        <button
          (click)="restart()"
          [disabled]="restarting"
          class="press-btn w-full py-3.5 text-sm font-bold tracking-[0.15em] uppercase
                 bg-[#0f0f0f] text-[#e5e5e5]
                 border-[3px] border-[#2a2a2a]
                 shadow-[5px_5px_0_#4ade80]
                 disabled:opacity-40 disabled:cursor-not-allowed">
          {{ restarting ? 'RESETTING…' : 'RESTART CHALLENGE' }}
        </button>
      </div>

      <div class="border-t-[3px] border-[#2a2a2a] px-4 py-1.5 flex justify-between text-[10px] text-[#e5e5e5]/50 tracking-[0.15em] uppercase">
        <span>Angul-It Terminal</span>
        <span>Session complete</span>
      </div>
    </div>

    <div class="absolute -bottom-3 -left-3 w-6 h-6 bg-[#1f1f1f]"></div>
    <div class="absolute -bottom-3 -right-3 w-6 h-6 bg-[#1f1f1f]"></div>
  </div>
</section>
